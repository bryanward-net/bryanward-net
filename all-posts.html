---
layout: default
---

<h1>All Posts</h1>
<hr />
<div style="padding-top: 30px;">
  {% for post in site.posts %}
    <div style="padding-bottom: 30px;">
      <strong style="margin-bottom: 4px;"><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></strong>
        <small>{{ post.date | date: "%-d %B %Y" }}</small>
        <p>
          {{ post.excerpt }}
        </p>
    </div>
  {% endfor %}
</div>
