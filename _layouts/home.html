---
layout: default
---

<h1>Recent Posts</h1>
<hr />
<div style="padding-top: 30px;">
  {% for post in site.posts limit:5 %}
    <div style="padding-bottom: 30px;">
      <h1 style="margin-bottom: 4px;"><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></h1>
      <small>{{ post.date | date: "%-d %B %Y" }}</small>
        <p>
          {{ post.excerpt }}
        </p>
    </div>
  {% endfor %}
</div>
